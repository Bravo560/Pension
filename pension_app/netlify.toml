[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Incluye el módulo compartido lib/ dentro del paquete de cada función.
  included_files = ["lib/**"]

# Aviso de vencimiento: corre todos los días a las 14:00 UTC (8:00 am hora de Ciudad de México).
[functions."send-warnings"]
  schedule = "0 14 * * *"
